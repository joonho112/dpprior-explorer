project:
  type: website
  output-dir: docs
  pre-render: scripts/pre-render.ts
  post-render: scripts/post-render.ts
  # Only these sources are Quarto documents. engine/ (TypeScript + node_modules),
  # verification/, catalog/schema/, embed/ and the Markdown contracts
  # (README, CONTRACT, ATTRIBUTION, DEPLOY) are never rendered.
  render:
    - "index.qmd"
    - "catalog.qmd"
    - "learning-paths.qmd"
    - "pages/**/*.qmd"
    - "!engine/"
    - "!verification/"
    - "!catalog/schema/"
    - "!embed/"
  # Copied verbatim into docs/ so widgets, embeds and data resolve by relative path.
  # Leading "/" anchors each glob at the project root; without it Quarto matched
  # "js/**" and "data/**" inside engine/node_modules/*/src/ as well (Step 3.6).
  resources:
    - "/js/**"
    - "/data/**"
    - "/media/**"
    - "/apps/**"
    - "/embed/**"
    - "/styles/**"
    - "/catalog/catalog.json"
    - "/catalog/thumbs/**"

